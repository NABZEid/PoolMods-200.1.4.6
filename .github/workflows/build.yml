name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek Android
        run: |
          cp pubspec.yaml /tmp/pubspec.keep.yaml
          flutter create . --platforms=android --project-name villiard --org com.villiard
          cp /tmp/pubspec.keep.yaml pubspec.yaml
          mkdir -p lib
          cp main.dart lib/main.dart
          rm -rf test
          bash tool/patch_android.sh
      - name: Ambil paket
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Simpan artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Buat rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PoolMods-200.1.4.6.apk
          gh release create "build-${{ github.run_number }}" PoolMods-200.1.4.6.apk --title "PoolMods-200.1.4.6 build ${{ github.run_number }}" --notes "APK dibuild otomatis dari GitHub Actions."
